name: CI

on:
  push:
    branches: [main, "feat/**", "chore/**", "cursor/**"]
  pull_request:

jobs:
  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest
      - name: Format check
        run: black --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy .

  cli-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest
      - name: Format check
        run: black --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy .

  public-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated public-truth surfaces
        run: python3 scripts/generate_agent_capabilities.py --check
      - name: Check callable-contract snapshot
        run: python3 scripts/callable_contract.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/web/package-lock.json
      - name: Install contract-test dependencies
        working-directory: packages/web
        run: npm ci
      - name: Run public-truth contract tests
        working-directory: packages/web
        run: npx vitest run tests/public-authority.contract.test.ts tests/astro-authority.contract.test.mjs tests/llms.contract.test.ts

  astro-web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/astro-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/astro-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
